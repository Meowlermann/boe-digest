name: Integración continua

# Comprueba cada PR contra main antes de fusionar: que todo compila, que las
# pruebas pasan, que el sitio se regenera entero sin red desde data/ y state/
# y que el resultado pasa tools/verificar.py. Nunca hace commit ni push: lo que
# genera el render se queda en la máquina del job.
#
# Render completo medido el 4 de octubre de 2026: unos 20 s en local y el job
# entero (con la instalación) en torno a 2 min. El tope de 20 min deja margen
# para que el sitio crezca y corta un render colgado.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # El mismo Python y las mismas dependencias que daily.yml.
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Los datos reales (data/, state/, debug/) viven en la rama datos: se
      # traen para pintar con ellos. Solo lectura: el CI no escribe en ninguna rama.
      - name: Traer los datos (rama datos)
        run: bash tools/datos.sh traer

      - name: Compilar
        run: python -m compileall -q -x '(^|/)\.git/' .

      - name: Pruebas
        run: python -m unittest discover tests

      - name: Regenerar el sitio sin red
        run: |
          INICIO=$(date +%s)
          python build.py --render --sin-red --sitio-completo
          echo "Render completo sin red: $(( $(date +%s) - INICIO )) s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verificar el resultado
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICAR_REF_DATOS: origin/datos
        run: |
          # Tamaño real del repositorio (el checkout es superficial); si la API
          # no responde, se mide solo lo descargado.
          export REPO_TAMANO_KB=$(gh api "repos/$GITHUB_REPOSITORY" --jq .size 2>/dev/null || true)
          # (a), (b), (c), (d) y (g) sobre el resultado; (e) y (f) sobre la
          # edición más reciente de data/. Falla si hay algún hallazgo grave;
          # los avisos van al resumen del job.
          python tools/verificar.py --modo ci

      # Lo mismo que publicaría publicar.yml: lo obligatorio, el CNAME y el
      # límite de 1 GB de Pages. No sube nada.
      - name: Montar _site (sin publicar)
        run: python tools/montar_sitio.py

      # Aviso, no bloqueo: este repo no tiene carpeta src/; además de
      # tools/ y .github/ se miran los fuentes de la raíz (*.py, plantillas
      # y assets/). Sale ::warning si cambian y docs/ no se ha tocado.
      # continue-on-error y exit 0: si la API o el git fallan, el job
      # sigue en verde.
      - name: Aviso de docs de traspaso
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          codigo=0
          docs=0
          lista=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if [ $? -ne 0 ] || [ -z "$lista" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            lista=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|docs) docs=1 ;;
              src/*|tools/*|.github/*|*.py|template*.html|assets/*|disparador/*)
                codigo=1 ;;
            esac
          done <<< "$lista"
          if [ "$codigo" -eq 1 ] && [ "$docs" -eq 0 ]; then
            echo "::warning::Esta PR toca código, tools/ o .github/ y no actualiza docs/. Si cambia el comportamiento, la operación o una decisión, actualiza docs/DECISIONES.md (y docs/OPERACION.md o docs/HOJA-DE-RUTA.md si les afecta). Si no aplica, márcalo en la casilla de la plantilla de PR."
          else
            echo "Docs de traspaso: sin aviso."
          fi
          exit 0
