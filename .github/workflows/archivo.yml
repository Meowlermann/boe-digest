name: Archivo histórico

# Rellena el archivo con ediciones pasadas del BOE. Solo a mano, por tramos:
# cada ejecución escribe como mucho `lote` ediciones nuevas y nunca pisa una
# que ya exista, así que se puede relanzar con los mismos parámetros hasta
# completar el tramo. Las ediciones de archivo son deterministas: sin LLM
# (no se pasa ninguna clave) y sin datos de las Cortes.
on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Primera fecha (AAAA-MM-DD)"
        required: true
        default: "2026-01-01"
      hasta:
        description: "Última fecha (AAAA-MM-DD). Vacío: la víspera de la primera edición diaria ya publicada"
        required: false
        default: ""
      lote:
        description: "Máximo de ediciones nuevas en esta ejecución"
        required: true
        default: "30"
      modo:
        description: "ediciones: rellena el archivo · repintar: vuelve a pintar todas las ediciones · reprocesar: relee los sumarios y actualiza solo state/ con los extractores de abajo · nombramientos: como reprocesar con extractores=nombramientos"
        required: true
        type: choice
        options: [ediciones, reprocesar, nombramientos, repintar]
        default: ediciones
      extractores:
        description: "Solo en modo reprocesar: nombramientos, provincias o nombramientos,provincias (una descarga por día para todos)"
        required: false
        default: "nombramientos,provincias"

# Desde la PR «publicacion-artefacto» lo hace publicar.yml (modo archivo):
# los datos van a la rama datos y la web se despliega como artefacto.
permissions:
  contents: read

jobs:
  publicar:
    if: vars.PUBLICAR_EN_MAIN != 'true'
    uses: ./.github/workflows/publicar.yml
    with:
      modo: archivo
      desde: ${{ inputs.desde }}
      hasta: ${{ inputs.hasta }}
      lote: ${{ inputs.lote }}
      archivo_modo: ${{ inputs.modo }}
      extractores: ${{ inputs.extractores }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write

  # VUELTA ATRÁS — publicación antigua con commit en main. Desactivada: solo
  # corre con la variable de repositorio PUBLICAR_EN_MAIN = "true". Ver
  # ARQUITECTURA.md §8. Se borra en la PR «main-solo-codigo».
  archivo-en-main:
    if: vars.PUBLICAR_EN_MAIN == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
    concurrency:
      group: escritura-datos
      cancel-in-progress: false
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Traer los datos (rama datos)
        run: bash tools/datos.sh traer

      - name: Construir las ediciones de archivo
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          LOTE: ${{ inputs.lote }}
          MODO: ${{ inputs.modo }}
          EXTRACTORES: ${{ inputs.extractores }}
        run: |
          if [ "$MODO" = "repintar" ]; then
            # Vuelve a pintar todas las ediciones con el código actual; no descarga nada.
            ARGS="--repintar-ediciones"
          elif [ "$MODO" = "nombramientos" ]; then
            # Solo el estado de nombramientos: ni data/ ni las ediciones.
            ARGS="--nombramientos-desde $DESDE"
            if [ -n "$HASTA" ]; then ARGS="$ARGS --nombramientos-hasta $HASTA"; fi
          elif [ "$MODO" = "reprocesar" ]; then
            # Solo state/ de los extractores pedidos; pausa de 1,5 s entre días.
            ARGS="--reprocesar-desde $DESDE --extractores ${EXTRACTORES:-nombramientos,provincias}"
            if [ -n "$HASTA" ]; then ARGS="$ARGS --reprocesar-hasta $HASTA"; fi
          else
            ARGS="--archivo-desde $DESDE --lote $LOTE"
            if [ -n "$HASTA" ]; then ARGS="$ARGS --archivo-hasta $HASTA"; fi
          fi
          python build.py $ARGS

      # Salud de la edición: después de construir y antes de publicar. Informa,
      # no bloquea: la edición se publica siempre, haya hallazgos o no.
      - name: Salud de la edición
        id: salud
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export REPO_TAMANO_KB=$(gh api "repos/$GITHUB_REPOSITORY" --jq .size 2>/dev/null || true)
          # Sin --fecha: revisa la última edición de data/. El informe va a
          # RUNNER_TEMP y no a debug/: una ejecución de archivo que no añade
          # ediciones no debe dejar ningún commit.
          python tools/verificar.py --modo diario --salida "$RUNNER_TEMP/salud.json" \
            --markdown "$RUNNER_TEMP/salud.md"

      - name: Publicar si hay cambios
        id: publicar
        if: always()
        run: |
          git config user.name "BOE Digest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add falla con 'pathspec did not match' si una carpeta no existe todavía
          # Las carpetas publicadas salen de tools/publicables.txt (único sitio).
          set -f   # los comodines (sitemap-*.xml) los resuelve git, no el shell
          mkdir -p data curated debug state
          git add -A data curated debug state
          for P in $(grep -v '^[[:space:]]*#' tools/publicables.txt | sed 's/^!//'); do
            git add -A -- "$P" 2>/dev/null || true    # una entrada sin ficheros no es un error
          done
          set +f
          if git diff --staged --quiet; then
            echo "Sin cambios: no se publica nada."
            echo "publicado=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Archivo (${{ inputs.modo || 'ediciones' }}): de ${{ inputs.desde }} a ${{ inputs.hasta || 'la primera publicada' }}"
            git push
            echo "publicado=si" >> "$GITHUB_OUTPUT"
          fi

      # Con hallazgos graves abre (o comenta) la incidencia «Salud de la edición»;
      # un día limpio la cierra. GitHub avisa por correo de las incidencias nuevas.
      - name: Incidencia de salud
        if: always() && steps.salud.outputs.graves != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/incidencia_salud.sh "${{ steps.salud.outputs.graves }}" "$(date +%Y-%m-%d)" "$RUNNER_TEMP/salud.md"

      - name: Avisar a los buscadores (IndexNow)
        if: steps.publicar.outputs.publicado == 'si'
        continue-on-error: true
        run: |
          if [ ! -s indexnow.json ]; then
            echo "No hay nada que notificar."
            exit 0
          fi
          head -c 500 indexnow.json; echo
          CODIGO=$(curl -sS -o /tmp/indexnow.out -w "%{http_code}" -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @indexnow.json https://api.indexnow.org/IndexNow)
          echo "IndexNow respondió $CODIGO"
          cat /tmp/indexnow.out 2>/dev/null || true
          case "$CODIGO" in
            200|202) echo "Aceptado." ;;
            *) echo "No aceptado; no bloquea la publicación." ;;
          esac
