name: Archivo histórico

# Rellena el archivo con ediciones pasadas del BOE. Solo a mano, por tramos:
# cada ejecución escribe como mucho `lote` ediciones nuevas y nunca pisa una
# que ya exista, así que se puede relanzar con los mismos parámetros hasta
# completar el tramo. Las ediciones de archivo son deterministas: sin LLM
# (no se pasa ninguna clave) y sin datos de las Cortes.
on:
  # TEMPORAL, solo para la prueba en la rama: GitHub no ofrece «Run workflow»
  # para un workflow que aún no está en main. Se quita antes de fusionar.
  push:
    branches: [nombramientos]
    paths: [".github/workflows/archivo.yml"]
  workflow_dispatch:
    inputs:
      desde:
        description: "Primera fecha (AAAA-MM-DD)"
        required: true
        default: "2026-01-01"
      hasta:
        description: "Última fecha (AAAA-MM-DD). Vacío: la víspera de la primera edición ya publicada"
        required: false
        default: ""
      lote:
        description: "Máximo de ediciones nuevas en esta ejecución"
        required: true
        default: "30"
      modo:
        description: "ediciones: rellena el archivo · nombramientos: solo relee la sección II y actualiza state/nombramientos.json"
        required: true
        type: choice
        options: [ediciones, nombramientos]
        default: ediciones

permissions:
  contents: write

# El mismo grupo que la edición diaria: nunca publican a la vez ni se pisan
# el commit.
concurrency:
  group: edicion-diaria
  cancel-in-progress: false

jobs:
  archivo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Construir las ediciones de archivo
        env:
          DESDE: ${{ inputs.desde || '2026-09-01' }}
          HASTA: ${{ inputs.hasta || '2026-09-10' }}
          LOTE: ${{ inputs.lote || '5' }}
          MODO: ${{ inputs.modo || 'nombramientos' }}
        run: |
          if [ "$MODO" = "nombramientos" ]; then
            # Solo el estado de nombramientos: ni data/ ni las ediciones.
            ARGS="--nombramientos-desde $DESDE"
            if [ -n "$HASTA" ]; then ARGS="$ARGS --nombramientos-hasta $HASTA"; fi
          else
            ARGS="--archivo-desde $DESDE --lote $LOTE"
            if [ -n "$HASTA" ]; then ARGS="$ARGS --archivo-hasta $HASTA"; fi
          fi
          python build.py $ARGS

      - name: Publicar si hay cambios
        id: publicar
        if: always()
        run: |
          git config user.name "BOE Digest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add falla con 'pathspec did not match' si una carpeta no existe todavía
          mkdir -p data curated debug state ediciones normas temas plazos diputados votaciones rankings preguntas personas nombramientos datos buscar mapa assets
          git add -A data curated debug state ediciones normas temas plazos diputados votaciones rankings preguntas personas nombramientos datos buscar mapa assets index.html 'sitemap*.xml' feed.xml
          if git diff --staged --quiet; then
            echo "Sin cambios: no se publica nada."
            echo "publicado=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Archivo (${{ inputs.modo || 'ediciones' }}): de ${{ inputs.desde }} a ${{ inputs.hasta || 'la primera publicada' }}"
            git push
            echo "publicado=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar a los buscadores (IndexNow)
        if: steps.publicar.outputs.publicado == 'si'
        continue-on-error: true
        run: |
          if [ ! -s indexnow.json ]; then
            echo "No hay nada que notificar."
            exit 0
          fi
          head -c 500 indexnow.json; echo
          CODIGO=$(curl -sS -o /tmp/indexnow.out -w "%{http_code}" -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @indexnow.json https://api.indexnow.org/IndexNow)
          echo "IndexNow respondió $CODIGO"
          cat /tmp/indexnow.out 2>/dev/null || true
          case "$CODIGO" in
            200|202) echo "Aceptado." ;;
            *) echo "No aceptado; no bloquea la publicación." ;;
          esac
