name: Edición diaria

on:
  schedule:
    # 06:10 UTC ≈ 08:10 en España (horario de verano) / 07:10 (invierno)
    - cron: "10 6 * * *"
  workflow_dispatch:        # permite lanzarla a mano desde la pestaña Actions

permissions:
  contents: write           # para hacer commit del index.html regenerado

concurrency:
  group: edicion-diaria
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Construir la edición de hoy
        env:
          # Opcional: cualquier proveedor compatible con la API de OpenAI.
          # Si no están definidos, el pipeline usa la redacción determinista.
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python build.py

      - name: Publicar si hay cambios
        run: |
          git config user.name "BOE Digest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data curated debug state index.html sitemap.xml
          if git diff --staged --quiet; then
            echo "Sin cambios: no se publica nada."
          else
            git commit -m "Edición del $(date +%Y-%m-%d)"
            git push
          fi
