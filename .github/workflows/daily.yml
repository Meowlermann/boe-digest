name: Edición diaria

# Tres pases al día (07:40, 14:40 y 21:40 en España) los lanza el Worker de
# disparador/ con workflow_dispatch. Los cron de aquí son solo respaldo.

on:
  schedule:
    # GitHub no garantiza la puntualidad de los cron: los encola y bajo carga
    # los retrasa horas. Medido aquí: programado a las 06:10 UTC, se ejecutó a
    # las 11:10 el 18 de septiembre y a las 10:55 el 19. Casi cinco horas tarde,
    # que para una edición diaria es la diferencia entre desayunar con ella o
    # leerla a mediodía.
    #
    # Dos mitigaciones: minutos "raros" (las horas en punto y los primeros
    # minutos son los más congestionados) y varios intentos. El primero que
    # entre publica; los siguientes encuentran la edición ya hecha y no
    # cambian nada, porque el paso de publicar solo hace commit si hay
    # diferencias reales.
    - cron: "37 5 * * *"    # 07:37 en España (verano) / 06:37 (invierno)
    - cron: "23 8 * * *"    # 10:23 / 09:23 — red de seguridad si el primero se retrasa
    - cron: "7 13 * * *"    # 15:07 / 14:07 — red de seguridad del pase de mediodía
    # El pase de la noche (21:40) no tiene cron de respaldo aquí a propósito:
    # con cinco horas de retraso caería pasada la medianoche UTC y build.py
    # abriría la edición del día siguiente con el BOE de hoy.
  workflow_dispatch:        # permite lanzarla a mano desde la pestaña Actions

# Desde la PR «publicacion-artefacto» la edición la construye y publica
# publicar.yml (modo diario): los datos van a la rama datos y la web se
# despliega como artefacto de GitHub Pages. El bot ya no escribe en main.
permissions:
  contents: read

jobs:
  publicar:
    if: vars.PUBLICAR_EN_MAIN != 'true'
    uses: ./.github/workflows/publicar.yml
    with:
      modo: diario
    secrets: inherit
    permissions:
      contents: write         # rama datos
      issues: write           # incidencia «Salud de la edición»
      pages: write            # despliegue
      id-token: write         # despliegue

  # VUELTA ATRÁS — publicación antigua con commit en main. Desactivada: solo
  # corre con la variable de repositorio PUBLICAR_EN_MAIN = "true" (y con
  # Settings › Pages en «Deploy from a branch»). Ver ARQUITECTURA.md §8.
  # Se borra en la PR «main-solo-codigo».
  publicar-en-main:
    if: vars.PUBLICAR_EN_MAIN == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    concurrency:
      group: escritura-datos
      cancel-in-progress: false
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Vuelta atrás sin perder lo publicado por la vía nueva: los datos más
      # recientes están en la rama datos.
      - name: Traer los datos (rama datos)
        run: bash tools/datos.sh traer

      - name: Construir la edición de hoy
        env:
          # Opcional: cualquier proveedor compatible con la API de OpenAI.
          # Si no están definidos, el pipeline usa la redacción determinista.
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Titulares y entradillas con Gemini, en una sola petición por pase.
          # Sin la clave, la edición sale igual con la redacción determinista.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELO: ${{ vars.GEMINI_MODELO }}
        run: python build.py

      # Salud de la edición: después de construir y antes de publicar. Informa,
      # no bloquea: la edición se publica siempre, haya hallazgos o no.
      - name: Salud de la edición
        id: salud
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export REPO_TAMANO_KB=$(gh api "repos/$GITHUB_REPOSITORY" --jq .size 2>/dev/null || true)
          python tools/verificar.py --modo diario --fecha "$(date +%Y-%m-%d)" \
            --markdown "$RUNNER_TEMP/salud.md"

      - name: Publicar si hay cambios
        id: publicar
        if: always()          # el diagnóstico debe subirse aunque la construcción falle
        run: |
          git config user.name "BOE Digest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add falla con 'pathspec did not match' si una carpeta no existe todavía
          # Las carpetas publicadas salen de tools/publicables.txt (único sitio).
          set -f   # los comodines (sitemap-*.xml) los resuelve git, no el shell
          mkdir -p data curated debug state
          git add -A data curated debug state
          for P in $(grep -v '^[[:space:]]*#' tools/publicables.txt | sed 's/^!//'); do
            git add -A -- "$P" 2>/dev/null || true    # una entrada sin ficheros no es un error
          done
          set +f
          if git diff --staged --quiet; then
            echo "Sin cambios: no se publica nada."
            echo "publicado=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Edición del $(date +%Y-%m-%d)"
            git push
            echo "publicado=si" >> "$GITHUB_OUTPUT"
          fi

      # Con hallazgos graves abre (o comenta) la incidencia «Salud de la edición»;
      # un día limpio la cierra. GitHub avisa por correo de las incidencias nuevas.
      - name: Incidencia de salud
        if: always() && steps.salud.outputs.graves != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/incidencia_salud.sh "${{ steps.salud.outputs.graves }}" "$(date +%Y-%m-%d)" "$RUNNER_TEMP/salud.md"

      - name: Avisar a los buscadores (IndexNow)
        # Bing, Yandex, Seznam, Naver, Yep e Internet Archive. No necesita cuenta:
        # la clave se sirve desde el propio sitio. Google no participa — eso se
        # hace una sola vez a mano desde Search Console.
        if: steps.publicar.outputs.publicado == 'si'
        continue-on-error: true      # que un buscador caído nunca tumbe la edición
        run: |
          if [ ! -s indexnow.json ]; then
            echo "No hay nada que notificar."
            exit 0
          fi
          head -c 500 indexnow.json; echo
          CODIGO=$(curl -sS -o /tmp/indexnow.out -w "%{http_code}" -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @indexnow.json https://api.indexnow.org/IndexNow)
          echo "IndexNow respondió $CODIGO"
          cat /tmp/indexnow.out 2>/dev/null || true
          case "$CODIGO" in
            200|202) echo "Aceptado." ;;
            *) echo "No aceptado; no bloquea la publicación." ;;
          esac
